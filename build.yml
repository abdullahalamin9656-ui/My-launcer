name: Build Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/my/launcher app/src/main/assets
          cat > settings.gradle <<'LAUNCHER_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MyLauncher"
          include ':app'
          LAUNCHER_EOF
          cat > build.gradle <<'LAUNCHER_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          LAUNCHER_EOF
          cat > gradle.properties <<'LAUNCHER_EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          LAUNCHER_EOF
          cat > app/build.gradle <<'LAUNCHER_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.my.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.my.launcher'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          LAUNCHER_EOF
          cat > app/src/main/AndroidManifest.xml <<'LAUNCHER_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="My Launcher"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          LAUNCHER_EOF
          cat > app/src/main/java/com/my/launcher/MainActivity.kt <<'LAUNCHER_EOF'
          package com.my.launcher

          import android.app.Activity
          import android.app.ActivityManager
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Bundle
          import android.os.Environment
          import android.os.StatFs
          import android.provider.MediaStore
          import android.provider.Settings
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.parseColor("#1c0a1d")
                  window.navigationBarColor = Color.parseColor("#000000")
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.setBackgroundColor(Color.BLACK)
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.webViewClient = WebViewClient()
                  web.loadUrl("file:///android_asset/index.html")
                  setContentView(web)
              }

              override fun onBackPressed() {
                  web.evaluateJavascript("goHome()", null)
              }

              override fun onNewIntent(i: Intent?) {
                  super.onNewIntent(i)
                  web.evaluateJavascript("goHome()", null)
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun apps(): String {
                      val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val list = packageManager.queryIntentActivities(q, 0)
                      val arr = ArrayList<Pair<String, String>>()
                      for (r in list) {
                          val p = r.activityInfo.packageName
                          if (p != packageName) arr.add(Pair(r.loadLabel(packageManager).toString(), p))
                      }
                      arr.sortBy { it.first.lowercase() }
                      val j = JSONArray()
                      for (x in arr) j.put(JSONObject().put("n", x.first).put("p", x.second))
                      return j.toString()
                  }

                  @JavascriptInterface
                  fun icon(p: String): String {
                      return try {
                          val d = packageManager.getApplicationIcon(p)
                          val bmp = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888)
                          d.setBounds(0, 0, 96, 96)
                          d.draw(Canvas(bmp))
                          val o = ByteArrayOutputStream()
                          bmp.compress(Bitmap.CompressFormat.PNG, 100, o)
                          "data:image/png;base64," + Base64.encodeToString(o.toByteArray(), Base64.NO_WRAP)
                      } catch (e: Exception) {
                          ""
                      }
                  }

                  @JavascriptInterface
                  fun launch(p: String) {
                      runOnUiThread {
                          try {
                              val i = packageManager.getLaunchIntentForPackage(p)
                              if (i != null) startActivity(i)
                          } catch (e: Exception) {
                          }
                      }
                  }

                  @JavascriptInterface
                  fun battery(): Int {
                      val i = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val l = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, 0) ?: 0
                      val s = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                      return l * 100 / s
                  }

                  @JavascriptInterface
                  fun ram(): String {
                      val m = ActivityManager.MemoryInfo()
                      (getSystemService(ACTIVITY_SERVICE) as ActivityManager).getMemoryInfo(m)
                      val st = StatFs(Environment.getDataDirectory().path)
                      val tot = st.blockCountLong * st.blockSizeLong
                      val fr = st.availableBlocksLong * st.blockSizeLong
                      val mb = 1048576L
                      val gb = 1073741824L
                      return ((m.totalMem - m.availMem) / mb).toString() + "|" + (m.totalMem / mb) + "|" + ((tot - fr) / gb) + "|" + (tot / gb)
                  }

                  @JavascriptInterface
                  fun act(n: String) {
                      runOnUiThread {
                          try {
                              val i: Intent? = when (n) {
                                  "phone" -> Intent(Intent.ACTION_DIAL)
                                  "sms" -> Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:"))
                                  "mail" -> Intent(Intent.ACTION_SENDTO, Uri.parse("mailto:"))
                                  "browser" -> Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com"))
                                  "camera" -> Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)
                                  "wifi" -> Intent(Settings.ACTION_WIFI_SETTINGS)
                                  "bt" -> Intent(Settings.ACTION_BLUETOOTH_SETTINGS)
                                  "settings" -> Intent(Settings.ACTION_SETTINGS)
                                  else -> null
                              }
                              if (i != null) {
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(i)
                              }
                          } catch (e: Exception) {
                          }
                      }
                  }
              }
          }
          LAUNCHER_EOF
          cat > app/src/main/assets/index.html <<'LAUNCHER_EOF'
          <!DOCTYPE html>
          <html lang="bn"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
          <style>
          :root{--p1:#ff2d6f;--p2:#ff8a3d;--s1:#3b1739;--s2:#270e27;--bg:#1c0a1d;--sh:#10040f;--hl:#5a2358}
          :root[data-theme=cyan]{--p1:#22d3ee;--p2:#818cf8;--s1:#13304a;--s2:#0b1b2f;--bg:#08121f;--sh:#04080f;--hl:#1f4d70}
          :root[data-theme=lime]{--p1:#a3e635;--p2:#22d3ee;--s1:#1d3a26;--s2:#0f2217;--bg:#08150d;--sh:#030a06;--hl:#2b5a3a}
          *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
          html,body{height:100%;background:var(--bg);overflow:hidden}
          body{font-family:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;color:#fff}
          .phone{height:100%;overflow-y:auto;padding:12px 10px 10px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(160deg,var(--bg),#000);scrollbar-width:none}
          .phone::-webkit-scrollbar{display:none}
          .n{background:linear-gradient(145deg,var(--s1),var(--s2));border:1px solid color-mix(in srgb,var(--p1) 22%,transparent);border-radius:18px;box-shadow:5px 5px 12px var(--sh),-3px -3px 9px color-mix(in srgb,var(--hl) 40%,transparent),inset 0 1px 0 color-mix(in srgb,var(--p1) 14%,transparent)}
          .in{background:linear-gradient(145deg,var(--s2),var(--s1));box-shadow:inset 3px 3px 7px var(--sh),inset -2px -2px 6px color-mix(in srgb,var(--hl) 50%,transparent);border-radius:14px}
          .g{background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
          .row{display:grid;gap:8px;flex:none}
          .r1{grid-template-columns:1fr 1fr}.r2{grid-template-columns:.8fr 1.2fr}
          .clock{padding:8px 10px;text-align:center}
          .clock .t{font-size:46px;line-height:1;letter-spacing:1px}
          .clock .s{font-size:15px;margin-top:2px}
          .line{height:2px;margin:6px 6px 3px;background:linear-gradient(90deg,var(--p1),transparent);border-radius:2px}
          .date{padding:8px 10px;text-align:center;font-family:ui-monospace,monospace;font-size:13px;letter-spacing:2px}
          .wk{display:flex;justify-content:space-between;font-size:8px;letter-spacing:0;margin:5px 0;opacity:.8;font-family:inherit}
          .wk b.on{color:var(--p2)}
          .chips{display:flex;gap:8px;justify-content:center}
          .chips div{padding:4px 10px;font-size:15px;min-width:46px;cursor:pointer}
          .small{padding:8px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
          .small .v{padding:7px 12px;text-align:center;font-size:20px}
          .small .v i{display:block;font-style:normal;font-size:10px;opacity:.8}
          .mid{display:flex;gap:6px;padding:6px;align-items:center}
          .an{width:92px;height:92px;flex:none;border-radius:50%;display:grid;place-items:center}
          .an svg{width:100%;height:100%}
          .meet{flex:1;font-size:12px;line-height:1.55;text-align:right;padding-right:6px}
          .meet h4{font-size:14px}
          .net{padding:8px 10px;font-size:12px;line-height:1.9}
          .net h4{font-size:14px;text-align:center}
          .net div{display:flex;justify-content:space-between;cursor:pointer}
          .quick{padding:8px;display:flex;flex-direction:column;gap:8px}
          .art{height:62px;border-radius:12px;background:linear-gradient(120deg,var(--p1),var(--p2) 70%,#f7c59f);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 6px #0007}
          .qb{display:flex;justify-content:space-around}
          .qb div{width:44px;height:30px;display:grid;place-items:center;font-size:17px;cursor:pointer}
          .bat{display:flex;align-items:center;gap:8px;padding:0 4px;flex:none}
          .bat .tr{flex:1;height:10px;padding:2px}
          .bat .tr i{display:block;height:100%;width:30%;border-radius:6px;background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 0 8px var(--p1)}
          .bat .c{padding:2px 10px;font-size:12px;border-radius:12px}
          .dockrow{display:grid;grid-template-columns:78px 1fr 78px;gap:6px;align-items:center;flex:none}
          .side{padding:8px 6px;display:flex;flex-direction:column;gap:10px;align-items:center;border-radius:26px}
          .pill{width:58px;height:34px;border-radius:17px;display:grid;place-items:center;font-size:19px;cursor:pointer;transition:transform .15s}
          .pill:active,.ringbtn:active{transform:scale(.86)}
          .ring{position:relative;aspect-ratio:1;border-radius:50%;width:100%}
          .ringbtn{position:absolute;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%)}
          .ringbtn img{width:24px;height:24px;border-radius:7px}
          .orb{position:absolute;left:50%;top:50%;width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 65% 35%,var(--p2),var(--p1) 45%,#2a0a5a);box-shadow:0 0 18px color-mix(in srgb,var(--p1) 60%,transparent)}
          .info{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:10px;flex:none}
          .tag{display:inline-block;padding:3px 12px;font-size:11px;margin-bottom:4px;letter-spacing:1px}
          .info p{font-family:ui-monospace,monospace;font-size:9.5px;line-height:1.6}
          .search{height:46px;border-radius:24px;display:flex;align-items:center;padding:0 18px;justify-content:space-between;font-size:24px;flex:none}
          .search em{font-style:normal;font-size:20px}
          .toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-60px);padding:7px 16px;border-radius:18px;font-size:12px;opacity:0;transition:.3s;z-index:9;white-space:nowrap}
          .toast.on{opacity:1;transform:translate(-50%,0)}
          .drawer{position:fixed;inset:0;background:#0a0410f5;padding:14px 12px;transform:translateY(100%);transition:transform .4s;overflow-y:auto;z-index:5}
          .drawer.open{transform:none}
          .sb{width:100%;padding:12px 18px;border-radius:22px;border:1px solid #fff3;background:#ffffff14;color:#fff;font-size:15px;margin-bottom:14px;outline:none}
          .dg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
          .app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;text-align:center}
          .app img{width:46px;height:46px;border-radius:14px;background:#ffffff12}
          .app span{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          </style></head><body>
          <div class="phone" id="ph">
           <div class="row r1">
            <div class="n clock" id="ck"><div class="t g" id="t"></div><div class="s g" id="s"></div><div class="line"></div></div>
            <div class="n date"><div class="g" id="dt"></div><div class="wk" id="wk"></div><div class="chips"><div class="in g" id="bc">--%</div><div class="in g" data-a="settings">⚙︎</div></div></div>
           </div>
           <div class="row r2">
            <div class="n small"><span class="g">Battery</span><div class="in v"><span class="g">⚡︎</span><b class="g" id="bv" style="display:block">--%</b><i class="g">চার্জ</i></div></div>
            <div class="n mid"><div class="an in"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--hl)" stroke-width="2"/><line id="hh" x1="50" y1="50" x2="50" y2="28" stroke="var(--p1)" stroke-width="4" stroke-linecap="round"/><line id="mh" x1="50" y1="50" x2="50" y2="18" stroke="var(--p2)" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="var(--p1)"/></svg></div>
             <div class="meet g" id="meet"></div></div>
           </div>
           <div class="row r2">
            <div class="n net"><h4 class="g">Network</h4><div class="g" data-a="wifi"><span>Wi-Fi</span><span>›</span></div><div class="g" data-a="bt"><span>Bluetooth</span><span>›</span></div><div class="g" data-a="settings"><span>Settings</span><span>›</span></div></div>
            <div class="n quick"><div class="art" id="gr"></div><div class="qb g"><div class="in" data-a="camera">◉</div><div class="in" data-a="browser">◎</div><div class="in" data-a="sms">✎︎</div></div></div>
           </div>
           <div class="bat"><div class="tr in"><i id="bt2"></i></div><div class="c n g" id="bp">⚡ --</div></div>
           <div class="dockrow">
            <div class="n side"><div class="pill in g" data-a="mail">✉︎</div><div class="pill in g" data-a="sms">✎︎</div><div class="pill in g" data-p="com.whatsapp">✆︎</div></div>
            <div class="ring n" id="ring"><div class="orb" id="orb"></div></div>
            <div class="n side"><div class="pill in g" data-a="phone">☎︎</div><div class="pill in g" data-a="browser">◎</div><div class="pill in g" data-a="camera">◉</div></div>
           </div>
           <div class="info"><div><span class="tag n g">System Info</span><p class="g" id="si"></p></div><div style="text-align:right"><span class="tag n g">My Launcher</span><p class="g" id="mi"></p></div></div>
           <div class="search n g" data-a="browser"><span>Search</span><em>⌕</em></div>
          </div>
          <div class="drawer" id="dr"><input class="sb" id="q" placeholder="🔍 অ্যাপ খুঁজুন..." oninput="render()"><div class="dg" id="dg"></div></div>
          <div class="toast n g" id="toast"></div>
          <script>
          var A=window.Android||{apps:function(){return"[]"},icon:function(){return""},battery:function(){return 80},ram:function(){return"3000|6000|40|128"},act:function(){},launch:function(){}};
          function $(i){return document.getElementById(i)}
          function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},1300)}
          var APPS=[];try{APPS=JSON.parse(A.apps())}catch(e){}
          var IC={};function icon(p){if(IC[p]===undefined){try{IC[p]=A.icon(p)}catch(e){IC[p]=""}}return IC[p]}
          function go(p){var ok=APPS.some(function(a){return a.p==p});if(ok)A.launch(p);else toast("অ্যাপটি ইনস্টল নেই")}
          document.addEventListener("click",function(e){var x=e.target.closest("[data-a],[data-p]");if(!x)return;if(x.dataset.a)A.act(x.dataset.a);else go(x.dataset.p)});
          function drawer(o){$("dr").classList.toggle("open",o);if(o){$("q").value="";render()}}
          function goHome(){drawer(false);$("ph").scrollTop=0}
          var tk=0;
          function render(){var t=++tk,q=$("q").value.toLowerCase(),d=$("dg"),l=[];d.innerHTML="";
           APPS.forEach(function(a){if(a.n.toLowerCase().indexOf(q)>-1){var b=document.createElement("div");b.className="app";b.innerHTML="<img><span></span>";b.lastChild.textContent=a.n;b.onclick=function(){A.launch(a.p)};d.appendChild(b);l.push([b.firstChild,a.p])}});
           var i=0;(function nx(){if(t!=tk||i>=l.length)return;var x=l[i++],s=icon(x[1]);if(s)x[0].src=s;setTimeout(nx,0)})()}
          var PREF=["org.telegram.messenger","com.facebook.katana","com.spotify.music","com.google.android.youtube","com.android.vending","com.google.android.apps.photos","com.facebook.orca","com.instagram.android","com.android.chrome","com.google.android.apps.maps"];
          var have={};APPS.forEach(function(a){have[a.p]=1});
          var rl=PREF.filter(function(p){return have[p]}).slice(0,6);
          APPS.forEach(function(a){if(rl.length<6&&rl.indexOf(a.p)<0&&a.p!="com.whatsapp")rl.push(a.p)});
          var ring=$("ring");
          rl.forEach(function(p,i){var b=document.createElement("div");b.className="ringbtn in";var im=document.createElement("img");im.src=icon(p);b.appendChild(im);b.onclick=function(){A.launch(p)};
           var a=(i/rl.length)*2*Math.PI-Math.PI/2;b.style.left=50+Math.cos(a)*36+"%";b.style.top=50+Math.sin(a)*36+"%";ring.appendChild(b)});
          $("orb").onclick=function(){drawer(true)};
          var y0=null,ph=$("ph");
          document.addEventListener("touchstart",function(e){y0=e.touches[0].clientY},{passive:true});
          document.addEventListener("touchend",function(e){if(y0===null)return;var dy=e.changedTouches[0].clientY-y0;y0=null;var d=$("dr");
           if(!d.classList.contains("open")&&dy<-90&&ph.scrollTop+ph.clientHeight>=ph.scrollHeight-4)drawer(true);
           else if(d.classList.contains("open")&&dy>90&&d.scrollTop<4)drawer(false)});
          var TH=["","cyan","lime"],ti=0;try{ti=+localStorage.getItem("th")||0}catch(e){}
          function setTh(){document.documentElement.setAttribute("data-theme",TH[ti])}setTh();
          $("ck").onclick=function(){ti=(ti+1)%TH.length;setTh();try{localStorage.setItem("th",ti)}catch(e){}toast("থিম বদলেছে ✨")};
          var D=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
          function z(n){return("0"+n).slice(-2)}
          function clk(){var n=new Date(),h=n.getHours(),m=n.getMinutes();
           $("t").textContent=z(h%12||12)+":"+z(m);$("s").textContent="Sec."+z(n.getSeconds())+" "+(h<12?"am":"pm");
           $("dt").textContent=n.getDate()+" "+M[n.getMonth()]+" "+n.getFullYear();
           $("wk").innerHTML=D.map(function(d,i){return"<b"+(i==n.getDay()?' class="on"':"")+">"+d+"</b>"}).join("");
           $("hh").setAttribute("transform","rotate("+((h%12)*30+m/2)+" 50 50)");$("mh").setAttribute("transform","rotate("+(m*6)+" 50 50)");
           $("gr").textContent=h<5?"শুভ রাত্রি":h<12?"শুভ সকাল":h<16?"শুভ দুপুর":h<18?"শুভ বিকাল":"শুভ সন্ধ্যা";
           var s="<h4>আজ ও আসছে</h4>";for(var i=0;i<4;i++){var d=new Date(n.getTime()+i*864e5);s+=d.toLocaleDateString("bn-BD",{weekday:"short",day:"numeric",month:"short"})+"<br>"}
           $("meet").innerHTML=s}
          function stat(){var b=A.battery();$("bc").textContent=b+"%";$("bv").textContent=b+"%";$("bt2").style.width=b+"%";$("bp").textContent="⚡ "+b;
           var r=String(A.ram()).split("|");$("si").innerHTML="RAM "+r[0]+"/"+r[1]+" MB<br>ROM "+r[2]+"/"+r[3]+" GB";
           $("mi").innerHTML="ইনস্টল করা অ্যাপ<br>"+APPS.length+" টি"}
          clk();stat();setInterval(clk,1000);setInterval(stat,15000);
          </script></body></html>
          LAUNCHER_EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: My Launcher v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
